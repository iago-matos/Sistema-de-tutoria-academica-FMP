name: Deploy do frontend (GitHub Pages)

# Publica a pasta frontend/ no GitHub Pages a cada push na main
# que altere o frontend, ou manualmente pela aba Actions.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita dois deploys ao mesmo tempo; o mais novo vence
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Empacotar a pasta frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
