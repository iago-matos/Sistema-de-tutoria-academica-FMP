name: CI

# Compila e roda os testes a cada push na main e em todo Pull Request
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Build e testes do backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e rodar os testes
        run: mvn -B verify
