name: Deploy do backend (Azure App Service)

# Compila, testa e publica o backend no Azure App Service a cada push na main
# que altere o backend, ou manualmente pela aba Actions.
#
# Configuracao no GitHub (Settings -> Secrets and variables -> Actions):
#   - Variable AZURE_WEBAPP_NAME: nome do App Service (ex.: tutoria-fmp-api)
#   - Secret AZURE_WEBAPP_PUBLISH_PROFILE: conteudo do "perfil de publicacao"
#     baixado no portal da Azure (App Service -> Visao geral -> Baixar perfil
#     de publicacao)
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

# Evita dois deploys ao mesmo tempo; o mais novo vence
concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar backend
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: ${{ steps.deploy.outputs.webapp-url }}

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Roda os testes (banco H2) antes de gerar o .jar: se falharem, nao publica
      - name: Compilar, testar e empacotar
        run: mvn -B package

      - name: Publicar no Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend/target/tutoria-api-1.0.0.jar
