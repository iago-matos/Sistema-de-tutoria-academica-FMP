<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Tutoria Acadêmica</title>
    <link rel="stylesheet" href="css/global.css">
    <script src="javascript/api.js"></script>
    <script src="javascript/auth.js"></script>
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="brand-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;color:#fff;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            </div>
            <strong>Tutoria Acadêmica</strong>
        </div>
        <h2>Bem-vindo de volta</h2>
        <form id="loginForm" onsubmit="handleLoginSubmit(event)">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>
            <div class="field">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="••••••••">
            </div>
            <button class="btn" type="submit">Entrar</button>
        </form>
        <div id="feedback" style="display:none;margin-top:12px;"></div>
        <p class="auth-footer">
            Não possui cadastro? <a href="signup.html">Cadastrar-se</a>
        </p>
    </div>
</body>
</html>
