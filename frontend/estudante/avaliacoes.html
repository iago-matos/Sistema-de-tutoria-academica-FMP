<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliações — Estudante | Tutoria Acadêmica</title>
    <link rel="stylesheet" href="../css/global.css">
    <script src="../javascript/api.js"></script>
    <script src="../javascript/auth.js"></script>
    <script src="../javascript/layout.js"></script>
    <script src="../javascript/utils.js"></script>
    <script defer src="../javascript/dashboard.js"></script>
</head>
<body data-page="estudante-avaliacoes" data-role="estudante" data-nav="avaliacoes">
    <div class="app-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-panel">
            <header class="page-header" id="pageHeader"></header>
            <section class="content-grid two-col">
                <section>
                    <div class="section-header"><h2>Minhas avaliações</h2></div>
                    <div id="avaliacoesLista"></div>
                </section>
                <section class="panel">
                    <div class="panel-header"><h2>Avaliar tutoria</h2></div>
                    <div class="panel-body stack">
                        <!-- Data e hora nao sao pedidas: o servidor registra o momento do envio -->
                        <form id="avaliacaoForm" class="avaliar-form" novalidate>
                            <fieldset class="avaliar-passo">
                                <legend>Quem você quer avaliar?</legend>
                                <div id="tutoresAvaliaveis" class="tutor-stories">
                                    <div class="loading-state">Carregando suas tutorias...</div>
                                </div>
                            </fieldset>

                            <fieldset class="avaliar-passo" id="notaPasso" disabled>
                                <legend id="notaLegenda">Como foi a tutoria?</legend>
                                <p class="avaliar-qual" id="qualTutoria" hidden></p>
                                <div class="rating-input" id="ratingInput"></div>
                                <p class="rating-label" id="ratingLabel" aria-live="polite">Escolha um tutor acima</p>

                                <div class="field avaliar-comentario">
                                    <label for="comentario">Comentário <span class="field-opcional">(opcional)</span></label>
                                    <textarea id="comentario" name="comentario" rows="3" maxlength="500"
                                        placeholder="Conte o que ajudou ou o que pode melhorar" aria-describedby="comentarioContador"></textarea>
                                    <span class="field-hint comentario-contador" id="comentarioContador">0/500</span>
                                </div>
                            </fieldset>

                            <button class="btn lg avaliar-enviar" id="avaliarEnviar" type="submit" disabled>Enviar avaliação</button>
                        </form>
                        <div id="feedback" style="display:none;" role="status"></div>
                    </div>
                </section>
            </section>
        </main>
    </div>
</body>
</html>
