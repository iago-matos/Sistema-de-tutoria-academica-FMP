<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Estudante | Tutoria Acadêmica</title>
    <link rel="stylesheet" href="../css/global.css">
    <script src="../javascript/api.js"></script>
    <script src="../javascript/auth.js"></script>
    <script src="../javascript/layout.js"></script>
    <script src="../javascript/utils.js"></script>
    <script defer src="../javascript/dashboard.js"></script>
</head>
<body data-page="estudante-dashboard" data-role="estudante" data-nav="inicio">
    <div class="app-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-panel">
            <header class="page-header" id="pageHeader"></header>
            <div id="loading" class="loading-state">Carregando dados...</div>

            <section class="stats-row">
                <article class="stat-card">
                    <div class="stat-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
                    <div class="stat-content"><div class="stat-value" id="statAgendamentos">--</div><div class="stat-label">Sessões agendadas</div></div>
                </article>
                <article class="stat-card">
                    <div class="stat-icon orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
                    <div class="stat-content"><div class="stat-value" id="statPendentes">--</div><div class="stat-label">Solicitações pendentes</div></div>
                </article>
                <article class="stat-card">
                    <div class="stat-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
                    <div class="stat-content"><div class="stat-value" id="statTutores">--</div><div class="stat-label">Tutores disponíveis</div></div>
                </article>
            </section>

            <section class="section">
                <div class="section-header">
                    <h2>Minhas solicitações</h2>
                    <a class="section-link" href="meus-agendamentos.html">Ver todas &gt;</a>
                </div>
                <div id="agendamentosPreview"></div>
            </section>

            <section class="section">
                <div class="section-header">
                    <h2>Tutores recomendados</h2>
                    <a class="section-link" href="buscar-tutores.html">Ver todos &gt;</a>
                </div>
                <div id="tutoresPreview"></div>
            </section>

            <section class="section">
                <div class="section-header">
                    <h2>Últimas avaliações</h2>
                    <a class="section-link" href="avaliacoes.html">Ver todas &gt;</a>
                </div>
                <div id="avaliacoesPreview"></div>
            </section>
        </main>
    </div>
</body>
</html>
