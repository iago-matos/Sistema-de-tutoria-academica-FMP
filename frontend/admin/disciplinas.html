<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disciplinas — Admin | Tutoria Acadêmica</title>
    <link rel="stylesheet" href="../css/global.css">
    <script src="../javascript/api.js"></script>
    <script src="../javascript/auth.js"></script>
    <script src="../javascript/layout.js"></script>
    <script src="../javascript/utils.js"></script>
    <script defer src="../javascript/dashboard.js"></script>
</head>
<body data-page="admin-disciplinas" data-role="admin" data-nav="disciplinas">
    <div class="app-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-panel">
            <header class="page-header" id="pageHeader"></header>
            <div id="loading" class="loading-state">Carregando disciplinas...</div>
            <div id="feedback" style="display:none;margin-bottom:16px;"></div>

            <div class="panel" style="margin-bottom:20px;">
                <div class="panel-header"><h2>Nova disciplina</h2></div>
                <div class="panel-body">
                    <form id="novaDisciplinaForm" class="disciplina-form">
                        <div class="field">
                            <label for="nomeDisciplina">Nome</label>
                            <input type="text" id="nomeDisciplina" required maxlength="120" placeholder="Ex.: Estrutura de Dados">
                        </div>
                        <button class="btn" type="submit">Adicionar</button>
                    </form>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header"><h2>Disciplinas da tutoria</h2></div>
                <div class="panel-body">
                    <div class="table-wrap"><table id="disciplinasTable"></table></div>
                    <p class="field-hint" style="margin-top:10px;">
                        Só é possível excluir disciplinas que nenhum tutor usa. Para corrigir um nome, use Renomear:
                        o nome novo vale também para as tutorias já registradas.
                    </p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
