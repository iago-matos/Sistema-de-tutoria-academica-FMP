<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Admin | Tutoria Acadêmica</title>
    <link rel="stylesheet" href="../css/global.css">
    <script src="../javascript/api.js"></script>
    <script src="../javascript/auth.js"></script>
    <script src="../javascript/layout.js"></script>
    <script src="../javascript/utils.js"></script>
    <script defer src="../javascript/dashboard.js"></script>
</head>
<body data-page="admin-dashboard" data-role="admin" data-nav="inicio">
    <div class="app-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-panel">
            <header class="page-header" id="pageHeader"></header>
            <div id="loading" class="loading-state">Carregando dados...</div>

            <section class="stats-row four-cols">
                <article class="stat-card">
                    <div class="stat-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
                    <div class="stat-content"><div class="stat-value" id="statUsuarios">--</div><div class="stat-label">Usuários</div></div>
                </article>
                <article class="stat-card">
                    <div class="stat-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
                    <div class="stat-content"><div class="stat-value" id="statEstudantes">--</div><div class="stat-label">Estudantes</div></div>
                </article>
                <article class="stat-card">
                    <div class="stat-icon purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
                    <div class="stat-content"><div class="stat-value" id="statTutores">--</div><div class="stat-label">Tutores</div></div>
                </article>
                <article class="stat-card">
                    <div class="stat-icon orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
                    <div class="stat-content"><div class="stat-value" id="statAgendamentos">--</div><div class="stat-label">Agendamentos</div></div>
                </article>
            </section>

            <section class="stats-row">
                <article class="stat-card">
                    <div class="stat-icon purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
                    <div class="stat-content"><div class="stat-value" id="statAvaliacoes">--</div><div class="stat-label">Avaliações</div></div>
                </article>
                <article class="stat-card">
                    <div class="stat-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
                    <div class="stat-content"><div class="stat-value" id="statCoordenadores">--</div><div class="stat-label">Coordenadores</div></div>
                </article>
            </section>

            <section class="section">
                <div class="section-header">
                    <h2>Agendamentos recentes</h2>
                    <a class="section-link" href="usuarios.html">Gerenciar usuários &gt;</a>
                </div>
                <div class="panel"><div class="panel-body"><div class="table-wrap"><table id="agendamentos"></table></div></div></div>
            </section>

            <section class="section">
                <div class="section-header"><h2>Usuários recentes</h2></div>
                <div id="usuariosLista"></div>
            </section>
        </main>
    </div>
</body>
</html>
