# Configuracao usada apenas pelos testes automatizados.
# Substitui o application.properties principal: os testes nao dependem
# de banco instalado nem de variaveis de ambiente.

spring.application.name=tutoria-api-test

# Banco em memoria, recriado a cada execucao, imitando o SQL Server
spring.datasource.url=jdbc:h2:mem:tutoria;MODE=MSSQLServer
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.use_nationalized_character_data=true

server.error.include-exception=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

jwt.secret=segredo-exclusivo-dos-testes-com-mais-de-32-caracteres
jwt.expiration=3600000

app.cors.allowed-origins=http://localhost:*
app.admin.emails=admin@teste.com
app.admin.senha-inicial=SenhaAdmin123

app.google.client-id=client-id-dos-testes.apps.googleusercontent.com
app.google.dominios=fmpsc.edu.br,aluno.fmpsc.edu.br
# Ligado aqui porque varios testes criam contas pelo cadastro com senha.
# O LoginGoogleTest desliga e confere que o cadastro e recusado.
app.cadastro-com-senha=true

# Lista inicial de disciplinas dos testes (os tutores de teste usam "Algoritmos")
app.disciplinas.iniciais=Algoritmos,Banco de Dados,Matem\u00e1tica
