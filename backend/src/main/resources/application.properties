spring.application.name=tutoria-api

# Le o arquivo .env da pasta backend/, se existir (modelo em .env.example).
# Variaveis de ambiente do sistema operacional tem prioridade sobre ele.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# Banco de dados (SQL Server / Azure SQL Database)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=tutoria_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}

# Pool de conexoes ajustado para o Azure SQL serverless:
# - minimum-idle=0 e idle-timeout: fecha conexoes paradas apos 1 minuto. Com
#   qualquer conexao aberta o banco nunca pausa e consome a cota gratuita.
# - connection-timeout e initialization-fail-timeout de 90 s: o banco pausado
#   recusa a primeira conexao (erro 40613) e leva cerca de 1 minuto para
#   acordar. O pool continua tentando nesse intervalo, em vez de falhar.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.connection-timeout=90000
spring.datasource.hikari.initialization-fail-timeout=90000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# Textos como nvarchar (Unicode): acentos e qualquer caractere sem conversao
spring.jpa.properties.hibernate.use_nationalized_character_data=true

server.error.include-exception=false

# Retorna JSON padronizado para rotas inexistentes (via GlobalExceptionHandler)
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Seguranca: sem valor padrao de proposito, a aplicacao nao sobe sem um segredo
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Origens que podem chamar a API, separadas por virgula
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Administradores criados automaticamente ao subir (e-mails separados por virgula)
app.admin.emails=${ADMIN_EMAILS:}
app.admin.senha-inicial=${ADMIN_SENHA_INICIAL:}

# Login com Google: so contas dos dominios institucionais (Google Workspace),
# separados por virgula. Sem GOOGLE_CLIENT_ID o botao do Google nao aparece.
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.dominios=${GOOGLE_DOMINIOS:fmpsc.edu.br,aluno.fmpsc.edu.br}

# Disciplinas criadas no primeiro uso, separadas por virgula. Depois, quem
# mantem a lista e a coordenacao (admin), na guia "Disciplinas".
# Acentos como \u00e1 (escape Unicode): o Spring le este arquivo como ISO-8859-1.
# Padrao: Matematica, Logica de Programacao, Banco de Dados, Algoritmos (com acentos)
app.disciplinas.iniciais=${DISCIPLINAS_INICIAIS:Matem\u00e1tica,L\u00f3gica de Programa\u00e7\u00e3o,Banco de Dados,Algoritmos}

# Cadastro publico com e-mail e senha (POST /usuario). Desligado por padrao:
# contas novas so pelo Google, que comprova que a pessoa e dona do e-mail.
app.cadastro-com-senha=${CADASTRO_COM_SENHA:false}

# Dados de demonstracao (DadosDemoSeeder): estudante com tutorias ja feitas,
# para testar a tela de avaliacao. NUNCA ligue em producao.
app.demo.ativo=${DEMO_DADOS:false}
app.demo.senha=${DEMO_SENHA:}
# Opcional: e-mail da SUA conta de estudante, que ganha as mesmas tutorias de teste
app.demo.estudante-email=${DEMO_ESTUDANTE_EMAIL:}
